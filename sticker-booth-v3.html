<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>스티커 사진관 2003</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--sky:#bfe6ff;--dot:#ffd9ea;--card:#fff;--ink:#4a2a55;--pink:#ffaad3;--baby:#ffc4dc;--soft:#fff0f7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--sky:#1c2f55;--dot:#5a3a6b;--card:#2a2147;--ink:#ffe8f5;--pink:#ff82c0;--baby:#c77aa6;--soft:#3a2b5c}}
:root[data-theme="dark"]{color-scheme:dark;--sky:#1c2f55;--dot:#5a3a6b;--card:#2a2147;--ink:#ffe8f5;--pink:#ffaad3;--baby:#c77aa6;--soft:#3a2b5c}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background-color:var(--sky);background-image:radial-gradient(circle,var(--dot) 22%,transparent 25%),radial-gradient(circle,var(--dot) 22%,transparent 25%);background-size:16px 16px;background-position:0 0,8px 8px;color:var(--ink);font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:16px}
main{max-width:1100px;margin:0 auto;padding:16px 14px 40px}
h1{margin:4px 0 10px;font-size:clamp(26px,5vw,40px);text-shadow:2px 2px 0 #fff,4px 4px 0 var(--baby)}
h1 small{display:block;font-size:14px;text-shadow:none;opacity:.7;letter-spacing:2px}
.steps{display:flex;gap:8px;list-style:none;padding:0;margin:0 0 14px}
.steps li{padding:5px 16px;border-radius:999px;border:3px solid var(--baby);background:var(--card);opacity:.7}
.steps li.on{background:var(--pink);color:#fff;border-color:#fff;opacity:1}
.wrap{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:16px;align-items:start}
@media(max-width:820px){.wrap{grid-template-columns:1fr}}
.bezel{background:#fff;padding:12px;border-radius:28px;border:4px solid var(--baby);box-shadow:0 8px 0 var(--baby)}
.cv{position:relative;aspect-ratio:3/2;border-radius:16px;overflow:hidden;background:repeating-conic-gradient(#3a2750 0 25%,#46315f 0 50%) 0 0/28px 28px}
.cv canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#start{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:20px;padding:14px 26px}
#msg{position:absolute;left:12px;right:12px;bottom:8px;margin:0;text-align:center;color:#fff;font-size:14px;text-shadow:0 1px 3px #000}
#cd{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(90px,24vw,200px);color:var(--pink);-webkit-text-stroke:6px #fff;paint-order:stroke fill;pointer-events:none}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .45s}
button,label.t{font:inherit;color:var(--ink);background:var(--card);border:3px solid var(--baby);border-radius:999px;padding:6px 14px;cursor:pointer}
button:hover:not(:disabled){background:var(--soft)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.main{background:var(--pink);color:#fff;border-color:#fff;box-shadow:0 4px 0 var(--baby)}
.main:hover:not(:disabled){background:var(--pink);filter:brightness(1.08)}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}
.row .main{font-size:19px;padding:8px 26px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.slot{aspect-ratio:3/2;padding:0;border-radius:14px;overflow:hidden;background:var(--card)}
.slot img{width:100%;height:100%;object-fit:cover;display:block}
.slot.on{border-color:var(--pink)}
.panel{background:var(--card);border:3px solid var(--baby);border-radius:22px;padding:12px 14px;margin-bottom:14px}
.panel h3{margin:0 0 8px;font-size:17px;font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip.on,.tab.on{background:var(--pink);color:#fff;border-color:var(--pink)}
.sw{width:30px;height:30px;padding:0;border-radius:50%}
.sw.on{outline:3px solid var(--ink);outline-offset:2px}
.line{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
input[type=range]{flex:1;accent-color:var(--pink)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px;max-height:240px;overflow:auto}
.grid button{padding:4px;border-radius:14px;aspect-ratio:1}
.grid img{width:100%;height:100%;object-fit:contain;display:block}
.grid .on{border-color:var(--pink);background:var(--soft)}
[hidden]{display:none!important}
#modal{position:fixed;inset:0;background:rgba(30,10,60,.78);display:grid;place-items:center;padding:16px;z-index:9;overflow:auto}
#modal div{background:var(--card);border-radius:24px;padding:14px;max-width:420px;text-align:center}
#modal img{max-width:100%;max-height:70vh;border-radius:10px;display:block;margin:0 auto 10px}
#strip{width:100%;display:block;border-radius:6px}
@media(prefers-reduced-motion:reduce){#flash{transition:none}}
@media print{body{background:#fff!important}h1,.steps,#s1,#s2,.noprint{display:none!important}.bezel{border:0;box-shadow:none;padding:0}@page{size:landscape;margin:8mm}#strip{width:100%}}

:root{--pc:#ff6fb5}
.cnt{text-align:center;margin:8px 0 0}
.pv{font-weight:700;font-size:17px}
.pv-b{color:var(--pc)}
.pv-m{background:linear-gradient(transparent 30%,color-mix(in srgb,var(--pc) 55%,transparent) 30% 92%,transparent 92%);padding:0 4px}
.pv-c{color:var(--pc);text-shadow:1px 1px 0 var(--pc),-1px 0 0 var(--pc),0 -1px 0 var(--pc);letter-spacing:1px}
.pv-n{display:inline-block;background:#2b1d44;color:#fff;border-radius:999px;padding:0 10px;text-shadow:0 0 3px #fff,0 0 7px var(--pc),0 0 13px var(--pc)}
.pv-g{color:transparent;font-size:18px;background:radial-gradient(circle,#fff 0 1.2px,transparent 1.8px) 0 0/8px 8px,radial-gradient(circle,#fff 0 1px,transparent 1.6px) 4px 3px/11px 11px,linear-gradient(var(--pc),var(--pc));-webkit-background-clip:text;background-clip:text}
.pv-d{color:transparent;font-size:19px;background:radial-gradient(circle,#fff 0 2.2px,transparent 2.8px) 0 0/9px 9px,linear-gradient(var(--pc),var(--pc));-webkit-background-clip:text;background-clip:text}
#ps .chip.on{background:var(--card);color:var(--ink);border-color:var(--ink)}
.gl{color:var(--pc);font-size:20px;line-height:1;vertical-align:middle}
</style>
</head>
<body>
<main>
<h1>스티커 사진관 ✦ 2003<small>y2k photo booth</small></h1>
<ol class="steps" id="steps"><li class="on">1 촬영</li><li>2 꾸미기</li><li>3 출력</li></ol>

<section id="s1" class="wrap">
 <div>
  <div class="bezel"><div class="cv">
   <canvas id="live" width="900" height="600"></canvas><div id="cd"></div><div id="flash"></div>
   <button id="start" class="main">카메라 켜기 ✦</button><p id="msg"></p>
  </div></div>
  <div class="row"><button id="shoot" class="main" disabled>한 장 찍기 ♡</button><button id="auto" disabled>남은 장수 연속 촬영</button><button id="next" class="main" disabled>꾸미러 가기</button></div>
  <p class="cnt" id="cnt">0 / 6 장</p>
  <div class="slots" id="sl1"></div>
 </div>
 <aside>
  <div class="panel"><h3>카메라</h3><div class="line" style="margin:0"><label class="t"><input type="checkbox" id="mi" checked> 거울 모드</label><label class="t">사진 불러오기<input type="file" id="up" accept="image/*" hidden></label><button id="reset">처음부터</button></div></div>
  <div class="panel"><h3>촬영 안내</h3><p style="margin:0;line-height:1.6">먼저 사진 6장을 찍어요. 필터와 프레임은 다음 화면에서 사진마다 골라요.</p></div>
 </aside>
</section>

<section id="s2" class="wrap" hidden>
 <div>
  <div class="bezel"><div class="cv"><canvas id="view" width="900" height="600"></canvas></div></div>
  <div class="slots" id="sl2"></div>
  <div class="row"><button id="undo">되돌리기</button><button id="clr">이 사진 지우기</button><button id="done" class="main">완성하기</button></div>
 </div>
 <aside>
  <div class="panel"><h3>프레임</h3><div class="chips" id="frc"></div><div class="line"><button id="frall">모든 사진에 같은 프레임</button></div></div>
  <div class="panel"><div class="chips" id="md"></div></div>
  <div class="panel" id="pp"><h3>데코펜</h3><div class="chips" id="ps"></div></div>
  <div class="panel" id="sp"><h3>스탬프 (꾹 누르고 움직여요)</h3><div class="chips" id="sk"></div></div>
  <div class="panel" id="cp"><h3>색깔</h3><div class="chips" id="co"></div></div>
  <div class="panel"><div class="line" style="margin:0"><span>크기</span><input type="range" id="sz" min="4" max="30" value="12"></div></div>
  <div class="panel" id="kp"><h3>스티커 (클릭해서 붙여요)</h3><div class="chips" id="kc"></div><div class="grid" id="kg"></div>
   <div class="line"><label class="t">내 스티커 추가<input type="file" id="ku" accept="image/*" multiple hidden></label></div></div>
 </aside>
</section>

<section id="s3" hidden>
 <div class="bezel"><canvas id="strip"></canvas></div>
 <div class="row noprint"><button id="print" class="main">인쇄하기</button><button id="save">이미지 저장</button><button id="back">다시 꾸미기</button><button id="again">새로 찍기</button></div>
</section>
</main>
<div id="modal" hidden><div><img id="out" alt="완성된 스티커 사진"><p>이미지를 오른쪽 클릭(또는 두 손가락 클릭)해서 저장하세요.</p><button id="x" class="main">닫기</button></div></div>

<script>
const W=900,H=600,N=6,$=s=>document.querySelector(s),el=(t,c)=>{const e=document.createElement(t);if(c)e.className=c;return e};
const live=$('#live'),lc=live.getContext('2d'),view=$('#view'),vc=view.getContext('2d');
const video=el('video');video.playsInline=true;video.muted=true;
const K='#6b4a63',X=3;
let mode='idle',mirror=true,tool='pen',penStyle='pen',stampKind='heart',color='#ff6fb5',size=12,sticker=null,cat='리본',busy=false;
let photos=[],decos=[],frs=[],hist=[],cur=0;

/* ---------- stickers (vector, drawn at 3x so they stay crisp) ---------- */
const svg=(w,h,b)=>{const i=new Image();i.w=w;i.h=h;i.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="'+w*X+'" height="'+h*X+'" viewBox="0 0 '+w+' '+h+'">'+b+'</svg>');return i};
const S='stroke="'+K+'" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"';
const rp=(d,c,w)=>'<path d="'+d+'" fill="'+c+'" stroke="'+K+'" stroke-width="'+(w+7)+'" stroke-linejoin="round"/><path d="'+d+'" fill="'+c+'" stroke="'+c+'" stroke-width="'+w+'" stroke-linejoin="round"/>';
const rf=(d,c,w)=>'<path d="'+d+'" fill="'+c+'" stroke="'+c+'" stroke-width="'+w+'" stroke-linejoin="round"/>';
const re=(x,y,a,b,r,c)=>'<ellipse cx="'+x+'" cy="'+y+'" rx="'+a+'" ry="'+b+'" fill="'+c+'" stroke="'+K+'" stroke-width="3.5" transform="rotate('+r+' '+x+' '+y+')"/>';
const rn=(x,y,a,b,r,c)=>'<ellipse cx="'+x+'" cy="'+y+'" rx="'+a+'" ry="'+b+'" fill="'+c+'" transform="rotate('+r+' '+x+' '+y+')"/>';
const bowG=c=>'<g stroke="'+K+'" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><path fill="'+c+'" d="M52 52Q40 84 26 82Q38 68 36 54Z"/><path fill="'+c+'" d="M68 52Q80 84 94 82Q82 68 84 54Z"/><ellipse fill="'+c+'" cx="32" cy="38" rx="27" ry="23" transform="rotate(-14 32 38)"/><ellipse fill="'+c+'" cx="88" cy="38" rx="27" ry="23" transform="rotate(14 88 38)"/><ellipse fill="#fff" opacity=".5" stroke="none" cx="24" cy="30" rx="11" ry="6" transform="rotate(-20 24 30)"/><ellipse fill="#fff" opacity=".5" stroke="none" cx="80" cy="30" rx="11" ry="6" transform="rotate(20 80 30)"/><circle fill="'+c+'" cx="60" cy="44" r="13"/><circle fill="#fff" opacity=".55" stroke="none" cx="56" cy="40" r="4"/></g>';
const bow=c=>svg(120,90,bowG(c));
function face(o){const c=o.c;let b='';
if(o.e==='cat')b+=rp('M24 54L28 18L56 36Z',c,8)+rp('M96 54L92 18L64 36Z',c,8);
if(o.e==='bunny')b+=re(40,26,11,27,-10,c)+re(80,26,11,27,10,c);
if(o.e==='bear')b+=re(26,38,14,14,0,c)+re(94,38,14,14,0,c);
if(o.e==='dog')b+=re(18,58,12,24,15,o.d||c)+re(102,58,12,24,-15,o.d||c);
b+=re(60,68,44,38,0,c);
b+=o.s?'<path d="M38 66q6 5 12 0M70 66q6 5 12 0" fill="none" '+S+'/>':o.r?'<ellipse cx="45" cy="65" rx="3.5" ry="6" fill="'+K+'"/><ellipse cx="75" cy="65" rx="3.5" ry="6" fill="'+K+'"/>':'<circle cx="45" cy="66" r="4.5" fill="'+K+'"/><circle cx="75" cy="66" r="4.5" fill="'+K+'"/>';
b+='<ellipse cx="33" cy="78" rx="8" ry="5" fill="#ff8fb0" opacity=".65"/><ellipse cx="87" cy="78" rx="8" ry="5" fill="#ff8fb0" opacity=".65"/><path d="M54 77q3 4 6 0q3 4 6 0" fill="none" '+S+'/>';
if(o.k==='bow')b+='<g transform="translate(74 6) scale(.4)">'+bowG(o.bc||'#ff6fb5')+'</g>';
if(o.k==='star')b+='<polygon fill="#ffe14d" '+S+' points="90,8 93,18 103,18 95,24 98,34 90,28 82,34 85,24 77,18 87,18"/>';
if(o.k==='heart')b+='<path fill="#ff6fb5" '+S+' d="M90 34C70 22 84 8 90 19C96 8 110 22 90 34Z"/>';
return svg(120,120,b)}
const ears=(t,c,i,bw)=>{let b='';
if(t==='cat')b=rp('M28 84L38 22L80 62Z',c,10)+rp('M172 84L162 22L120 62Z',c,10)+rf('M42 68L45 40L64 60Z',i,6)+rf('M158 68L155 40L136 60Z',i,6);
if(t==='bunny')b=re(52,50,17,44,-10,c)+re(148,50,17,44,10,c)+rn(52,52,8,30,-10,i)+rn(148,52,8,30,10,i);
if(t==='lop')b=re(52,50,17,44,-10,c)+rn(52,52,8,30,-10,i)+re(150,68,16,36,52,c)+rn(150,68,8,26,52,i);
if(t==='bear')b=re(42,62,28,28,0,c)+re(158,62,28,28,0,c)+rn(42,62,14,14,0,i)+rn(158,62,14,14,0,i);
if(t==='dog')b=re(36,58,20,40,24,c)+re(164,58,20,40,-24,c);
if(bw)b+='<g transform="translate(80 40) scale(.34)">'+bowG(bw)+'</g>';
return svg(200,100,b)};
const blush=v=>{let b='';for(const x of [38,122]){b+='<ellipse cx="'+x+'" cy="26" rx="26" ry="15" fill="#ff8fb0" opacity="'+(v===1?.35:.55)+'"/>';
if(v===1)b+='<path d="M'+(x-12)+' 32l8-14M'+(x-2)+' 32l8-14M'+(x+8)+' 32l8-14" stroke="#ff5f8f" stroke-width="3.5" stroke-linecap="round"/>';
if(v===2)b+='<path d="M'+x+' 14l4 9 9 1-7 6 2 9-8-5-8 5 2-9-7-6 9-1z" fill="#ff5f8f" opacity=".85"/>'}
return svg(160,52,b)};
const FONT="'Hiragino Maru Gothic ProN','Yu Gothic UI',Meiryo,'Apple SD Gothic Neo',sans-serif";
const JC=[['#ff4fa0','#ffe3f0'],['#7a5cff','#ece6ff'],['#ff7a3d','#fff0d6'],['#2aa6ff','#e0f3ff'],['#2fbf8a','#e0fff2']];
const jt=(t,i)=>{const [c,bg]=JC[i%5],w=t.length*34+50;return svg(w,66,'<rect x="3" y="3" width="'+(w-6)+'" height="60" rx="30" fill="'+bg+'" stroke="#fff" stroke-width="5"/><rect x="3" y="3" width="'+(w-6)+'" height="60" rx="30" fill="none" stroke="'+c+'" stroke-width="2.5" stroke-dasharray="1 6" stroke-linecap="round"/><text x="'+w/2+'" y="45" text-anchor="middle" font-family="'+FONT+'" font-size="32" font-weight="700" fill="'+c+'" stroke="#fff" stroke-width="5" paint-order="stroke">'+t+'</text>')};
const pix={blob:['...kkkk...','..kppppk..','.kppppppk.','kppppppppk','kpkppppkpk','kppppppppk','kpbppppbpk','.kppkkppk.','..kppppk..','...kkkk...'],
chick:['....kk....','..kkppkk..','.kppppppk.','kppppppppk','kpkppppkpk','kpppoopppk','kppppppppk','.kppppppk.','..kkppkk..','...k..k...'],
cat:['kk......kk','kpk....kpk','kppkkkkppk','kppppppppk','kpkppppkpk','kppppppppk','kpbppppbpk','.kppkkppk.','..kppppk..','...kkkk...']};
const pet=(g,p)=>{const c=el('canvas');c.width=c.height=120;const x=c.getContext('2d');pix[g].forEach((r,y)=>[...r].forEach((ch,i)=>{if(ch==='.')return;x.fillStyle=ch==='k'?K:ch==='p'?p:ch==='b'?'#ff9fc0':'#ffa94d';x.fillRect(i*12,y*12,12,12)}));const i=new Image();i.w=i.h=120;i.src=c.toDataURL();return i};
const CATS={'리본':['#ff6fb5','#ff5a6e','#6fb8ff','#b79bff','#ffe14d','#ffffff','#7be0b0','#ffb98a'].map(bow),
'일본어':['カワイイ','すきぴ','ちゅき','だいすき','ぴえん','ゆめかわ','ふわふわ','もちもち','めろめろ','らぶ♡'].map(jt),
'픽셀펫':[pet('blob','#ffc4dc'),pet('blob','#b8f0d8'),pet('chick','#fff08a'),pet('chick','#ffc4dc'),pet('cat','#d9c8ff'),pet('cat','#ffd9b8')],
'말랑친구':[{c:'#ffd6e8',e:'bunny',k:'bow'},{c:'#d8f5e6',e:'cat',k:'star'},{c:'#e6dcff',e:'bear',k:'bow',bc:'#6fb8ff'},{c:'#fff1b8',e:'dog',d:'#f0c97a'},{c:'#ffd9c7',e:'cat',k:'bow'},{c:'#ffffff',e:'bear',k:'star'}].map(face),
'느긋친구':[{c:'#e3c7a5',e:'bear',s:1},{c:'#fff3a8',e:'none',s:1},{c:'#ffd0d0',e:'bunny',s:1},{c:'#cfe8d0',e:'cat',s:1},{c:'#ffffff',e:'none',s:1,k:'star'},{c:'#d6d3ff',e:'dog',s:1,d:'#aaa6f0'}].map(face),
'레트로친구':[{c:'#ffc9de',e:'cat',r:1,k:'heart'},{c:'#bfe3ff',e:'dog',r:1,d:'#8cc4f0',k:'star'},{c:'#fff0a0',e:'bunny',r:1,k:'heart'},{c:'#d9c8ff',e:'bear',r:1,k:'star'},{c:'#c8f2dc',e:'cat',r:1,k:'heart'},{c:'#ffd6a8',e:'dog',r:1,d:'#f0aa6a'}].map(face),
'동물귀':[ears('cat','#fff','#ffc4dc'),ears('cat','#5a4a60','#ff9fc0','#ff6fb5'),ears('cat','#ffd6e8','#fff','#fff'),ears('bunny','#fff','#ffc4dc'),ears('lop','#e6dcff','#ffc4dc','#ff6fb5'),ears('bear','#d9a98b','#f5d5c0'),ears('bear','#fff','#ffc4dc','#6fb8ff'),ears('dog','#d9a98b','#d9a98b'),ears('dog','#fff1b8','#fff1b8','#ff6fb5')],
'볼터치':[blush(0),blush(1),blush(2)],'내 스티커':[]};
sticker=CATS['리본'][0];

/* ---------- frames (cute character borders) ---------- */
const FR=[{n:'없음'},
{n:'스위트 베이커리',t:'Sweet Bakery',bg:'#cdf0a8',pat:1,pc:'#a6e07a',m:['🍓','🧁','🍰','🍩','🍒'],f:0},
{n:'러블리',t:'Lovely',bg:'#ffc4dc',pat:2,pc:'#fff',m:['🍧','🍡','🩰','💗','🥣'],f:1},
{n:'소큐트',t:'So Cute',bg:'#3b2a4a',pat:3,pc:'#fff',m:['🍮','🎀','⭐','💖'],f:2,tc:'#ff7ab8'},
{n:'해피',t:'HAPPY!',bg:'#fff1a8',pat:4,pc:'#ffcf3a',m:['⭐','🍎','☁️','🫧','🧃'],f:3},
{n:'프렌즈',t:'Friends',bg:'#bfe3ff',pat:5,pc:'#fff',m:['🐱','🐻‍❄️','🐻','🐰','🐼'],f:4,tc:'#4d8dff'},
{n:'드리미',t:'Dreamy',bg:'#e6d6ff',pat:6,pc:'#fff',m:['🍼','💒','🌙','💍','🎀'],f:5,tc:'#9a6bff'}];
const fcache={};
function frameImg(k){if(!k)return null;if(fcache[k])return fcache[k];const f=FR[k],o=el('canvas');o.width=W;o.height=H;const c=o.getContext('2d'),bw=72;
c.save();c.beginPath();c.rect(0,0,W,H);c.roundRect(bw,bw,W-2*bw,H-2*bw,28);c.clip('evenodd');c.fillStyle=f.bg;c.fillRect(0,0,W,H);c.fillStyle=f.pc;
if(f.pat===1){c.globalAlpha=.55;for(let i=0;i<W;i+=30)c.fillRect(i,0,15,H);for(let j=0;j<H;j+=30)c.fillRect(0,j,W,15)}
else{c.textAlign='center';c.textBaseline='middle';c.font='16px sans-serif';c.globalAlpha=.75;for(let y=10,r=0;y<H;y+=26,r++)for(let x=(r%2)*14+6;x<W;x+=28){if(f.pat===3||f.pat===5){c.beginPath();c.arc(x,y,f.pat===3?5:3.5,0,7);c.fill()}else c.fillText(f.pat===2?'♡':f.pat===4?'★':'✦',x,y)}}
c.restore();c.strokeStyle='#fff';c.lineWidth=8;c.beginPath();c.roundRect(bw,bw,W-2*bw,H-2*bw,28);c.stroke();c.lineWidth=6;c.beginPath();c.roundRect(3,3,W-6,H-6,20);c.stroke();
const faces=CATS['말랑친구'].concat(CATS['레트로친구']);let n=0;c.textAlign='center';c.textBaseline='middle';
const put=(x,y)=>{if(y<bw&&Math.abs(x-W/2)<180)return;const q=n++;if(q%5===4)c.drawImage(faces[(q+f.f)%faces.length],x-27,y-27,54,54);else{c.font='36px sans-serif';c.fillText(f.m[q%f.m.length],x,y)}};
for(let x=40;x<W-20;x+=58){put(x,bw/2);put(x,H-bw/2)}for(let y=bw+30;y<H-bw-10;y+=58){put(bw/2,y);put(W-bw/2,y)}
c.drawImage(faces[f.f%faces.length],4,H-124,114,114);c.drawImage(faces[(f.f+3)%faces.length],W-118,H-124,114,114);
c.font='46px "Jua","Hiragino Maru Gothic ProN",sans-serif';c.lineJoin='round';c.lineWidth=10;c.strokeStyle='#fff';c.strokeText(f.t,W/2,bw/2+2);c.fillStyle=f.tc||'#ff4fa0';c.fillText(f.t,W/2,bw/2+2);
return fcache[k]=o}

/* ---------- ui builders ---------- */
function chips(box,items,get,on,cls){const b0=typeof box==='string'?$(box):box;b0.innerHTML='';items.forEach((it,i)=>{const b=el('button',cls||'chip');get(b,it,i);b.onclick=()=>{on(it,i);[...b0.children].forEach(c=>c.classList.toggle('on',c===b))};b0.appendChild(b)});b0.children[0]&&b0.children[0].classList.add('on')}
const MODES=[['pen','✏️ 데코펜'],['stamp','🎡 스탬프'],['sticker','🎀 스티커'],['eraser','🧽 지우개']];
chips('#frc',FR,(b,f)=>b.textContent=f.n,(f,i)=>{frs[cur]=i;render();sl2()});
chips('#md',MODES,(b,m)=>b.textContent=m[1],m=>setMode(m[0]),'tab');
chips('#ps',[['pen','기본펜','pv-b'],['marker','마커펜','pv-m'],['crayon','크레용','pv-c'],['neon','네온펜','pv-n'],['glitter','글리터펜','pv-g'],['dot','도트펜','pv-d']],(b,p)=>b.innerHTML='<span class="pv '+p[2]+'">'+p[1]+'</span>',p=>penStyle=p[0]);
chips('#sk',[['heart','♥','하트'],['star','★','별'],['flower','✿','꽃'],['bubble','◦○','방울'],['paw','🐾','발자국']],(b,p)=>b.innerHTML='<span class="gl">'+p[1]+'</span> '+p[2],p=>stampKind=p[0]);
chips('#co',['#ff6fb5','#ff5a6e','#ff9a3d','#ffe14d','#7be495','#4fd6d0','#4db8ff','#a774ff','#ffffff','#4a2a55'],(b,c)=>{b.style.background=c;b.setAttribute('aria-label','색 '+c)},c=>{color=c;document.documentElement.style.setProperty('--pc',c)},'sw');
chips('#kc',Object.keys(CATS),(b,c)=>b.textContent=c,c=>{cat=c;grid()});
function grid(){const g=$('#kg');g.innerHTML='';CATS[cat].forEach(im=>{const b=el('button');if(im===sticker)b.className='on';const i=new Image();i.src=im.src;b.appendChild(i);b.onclick=()=>{sticker=im;setMode('sticker');[...g.children].forEach(c=>c.classList.toggle('on',c===b))};g.appendChild(b)})}
function setMode(m){tool=m;[...$('#md').children].forEach((c,i)=>c.classList.toggle('on',MODES[i][0]===m));$('#pp').hidden=m!=='pen';$('#sp').hidden=m!=='stamp';$('#cp').hidden=!(m==='pen'||m==='stamp');$('#kp').hidden=m!=='sticker'}
setMode('pen');grid();
const syncFrame=()=>[...$('#frc').children].forEach((c,i)=>c.classList.toggle('on',i===frs[cur]));
$('#sz').oninput=e=>size=+e.target.value;$('#mi').onchange=e=>mirror=e.target.checked;
$('#frall').onclick=()=>{frs=frs.map(()=>frs[cur]);sl2()};
$('#ku').onchange=e=>{[...e.target.files].forEach(f=>{const i=new Image();i.onload=()=>{CATS['내 스티커'].push(i);cat='내 스티커';sticker=i;grid();[...$('#kc').children].forEach(c=>c.classList.toggle('on',c.textContent===cat))};i.src=URL.createObjectURL(f)})};

/* ---------- camera (shoot only) ---------- */
function loop(){if(mode==='live'&&video.readyState>=2){const vw=video.videoWidth,vh=video.videoHeight,s=Math.max(W/vw,H/vh),dw=vw*s,dh=vh*s;lc.save();if(mirror){lc.translate(W,0);lc.scale(-1,1)}lc.drawImage(video,(W-dw)/2,(H-dh)/2,dw,dh);lc.restore()}requestAnimationFrame(loop)}
loop();
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function btns(){const on=mode==='live'&&!busy&&photos.length<N;$('#shoot').disabled=$('#auto').disabled=!on;$('#next').disabled=busy||!photos.length;$('#cnt').textContent=photos.length+' / '+N+' 장'}
$('#start').onclick=async()=>{const m=$('#msg');m.textContent='';try{const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:false});video.srcObject=st;await video.play();mode='live';$('#start').hidden=true;btns()}
catch(e){m.textContent='카메라를 켤 수 없어요 ('+(e&&e.name||'오류')+'). 내려받은 파일을 Chrome에서 열거나, 사진 불러오기를 써 주세요.'}};
function addPhoto(draw){if(photos.length>=N)return;const p=el('canvas'),d=el('canvas');p.width=d.width=W;p.height=d.height=H;draw(p.getContext('2d'));frs.push(1+photos.length%6);photos.push(p);decos.push(d);hist.push([]);sl1();btns()}
async function snap(){const cd=$('#cd');for(const n of [3,2,1]){cd.textContent=n;await wait(900)}cd.textContent='';const fl=$('#flash');fl.style.transition='none';fl.style.opacity=1;addPhoto(c=>c.drawImage(live,0,0));requestAnimationFrame(()=>{fl.style.transition='';fl.style.opacity=0})}
$('#shoot').onclick=async()=>{if(busy||mode!=='live')return;busy=true;btns();await snap();busy=false;btns()};
$('#auto').onclick=async()=>{if(busy||mode!=='live')return;busy=true;btns();while(photos.length<N){await snap();await wait(600)}busy=false;btns()};
$('#up').onchange=e=>{const f=e.target.files[0];if(!f)return;const i=new Image();i.onload=()=>addPhoto(c=>{const s=Math.max(W/i.width,H/i.height);c.drawImage(i,(W-i.width*s)/2,(H-i.height*s)/2,i.width*s,i.height*s)});i.src=URL.createObjectURL(f);e.target.value=''};
$('#reset').onclick=()=>{photos=[];decos=[];frs=[];hist=[];cur=0;sl1();btns()};
function comp(i,c,w,h){c.drawImage(photos[i],0,0,w,h);const f=frameImg(frs[i]);if(f)c.drawImage(f,0,0,w,h);c.drawImage(decos[i],0,0,w,h)}
function thumb(i){const c=el('canvas');c.width=240;c.height=160;comp(i,c.getContext('2d'),240,160);return c.toDataURL('image/jpeg',.6)}
function slots(box,click){box.innerHTML='';for(let i=0;i<N;i++){const d=el('button','slot');if(photos[i]){const im=new Image();im.src=thumb(i);d.appendChild(im);if(click){d.onclick=()=>{cur=i;render();syncFrame();slots(box,true)};if(i===cur)d.classList.add('on')}}else{d.textContent=i+1;d.disabled=true}box.appendChild(d)}}
const sl1=()=>slots($('#sl1'),false),sl2=()=>slots($('#sl2'),true);sl1();
function go(n){['s1','s2','s3'].forEach((id,i)=>$('#'+id).hidden=i+1!==n);[...$('#steps').children].forEach((li,i)=>li.classList.toggle('on',i+1===n));scrollTo(0,0)}
$('#next').onclick=()=>{cur=0;go(2);render();syncFrame();sl2()};

/* ---------- decorating ---------- */
function render(){if(!photos[cur])return;vc.clearRect(0,0,W,H);comp(cur,vc,W,H)}
const dx=()=>decos[cur].getContext('2d');
const push=()=>{const h=hist[cur];h.push(dx().getImageData(0,0,W,H));if(h.length>15)h.shift()};
$('#undo').onclick=()=>{const h=hist[cur];if(h.length){dx().putImageData(h.pop(),0,0);render();sl2()}};
$('#clr').onclick=()=>{push();dx().clearRect(0,0,W,H);render();sl2()};
const pt=e=>{const r=view.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}};
let drawing=false,last=null,carry=0;
view.onpointerdown=e=>{view.setPointerCapture(e.pointerId);const p=pt(e);push();
if(tool==='sticker'){const im=sticker,w=size*8+60,h=w*((im.h||im.naturalHeight)/(im.w||im.naturalWidth));const c=dx();c.save();c.translate(p.x,p.y);c.rotate((Math.random()-.5)*.3);c.drawImage(im,-w/2,-h/2,w,h);c.restore();render();sl2();return}
drawing=true;last=p;carry=0;seg(p,p)};
view.onpointermove=e=>{if(!drawing)return;const p=pt(e);seg(last,p);last=p};
view.onpointerup=view.onpointercancel=()=>{if(drawing){drawing=false;sl2()}};
const ln=(c,a,b)=>{c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.stroke()};
const rnd=n=>(Math.random()-.5)*n;
function seg(a,b){const c=dx();c.save();c.lineCap=c.lineJoin='round';
if(tool==='stamp'){const s=size*3+24,sp=s*(stampKind==='bubble'?.7:.9),dist=Math.hypot(b.x-a.x,b.y-a.y);let t=sp-carry;
if(!dist){stampAt(c,stampKind,a.x,a.y,s)}else{for(;t<=dist;t+=sp)stampAt(c,stampKind,a.x+(b.x-a.x)*t/dist,a.y+(b.y-a.y)*t/dist,s);carry=(carry+dist)%sp}}
else{c.lineWidth=size;c.strokeStyle=color;const ps=tool==='eraser'?'er':penStyle;
if(ps==='er'){c.globalCompositeOperation='destination-out';c.lineWidth=size*1.6;ln(c,a,b)}
else if(ps==='marker'){c.globalAlpha=.4;c.lineWidth=size*2.4;c.lineCap='butt';ln(c,a,b)}
else if(ps==='crayon'){c.globalAlpha=.6;c.lineWidth=size*.55;for(let i=0;i<4;i++)ln(c,{x:a.x+rnd(size*.8),y:a.y+rnd(size*.8)},{x:b.x+rnd(size*.8),y:b.y+rnd(size*.8)})}
else if(ps==='neon'){c.shadowColor=color;c.shadowBlur=20;ln(c,a,b);c.shadowBlur=0;c.strokeStyle='#fff';c.lineWidth=size*.35;ln(c,a,b)}
else if(ps==='glitter'){c.globalAlpha=.55;ln(c,a,b);c.globalAlpha=1;for(let i=0;i<4;i++){const x=b.x+rnd(size*2.4),y=b.y+rnd(size*2.4);c.fillStyle=['#fff',color,'#fff6a8'][i%3];if(Math.random()<.2){c.font=(8+Math.random()*size)+'px sans-serif';c.textAlign='center';c.fillText('✦',x,y)}else{c.beginPath();c.arc(x,y,1+Math.random()*3,0,7);c.fill()}}}
else if(ps==='dot'){ln(c,a,b);c.fillStyle='#fff';c.globalAlpha=.85;for(let i=0;i<2;i++){c.beginPath();c.arc(b.x+rnd(size*.7),b.y+rnd(size*.7),Math.max(1.3,size*.09),0,7);c.fill()}}
else ln(c,a,b)}
c.restore();render()}
function stampAt(c,k,x,y,s){c.save();c.translate(x,y);c.fillStyle=c.strokeStyle=color;const r=s*.5;
if(k==='heart'){c.rotate(rnd(.5));c.lineJoin='round';c.lineWidth=s*.12;c.beginPath();c.moveTo(0,r*.8);c.bezierCurveTo(-r*1.45,r*.15,-r*.95,-r*.95,0,-r*.3);c.bezierCurveTo(r*.95,-r*.95,r*1.45,r*.15,0,r*.8);c.fill();c.stroke();c.fillStyle='rgba(255,255,255,.65)';c.beginPath();c.ellipse(-r*.5,-r*.28,r*.2,r*.12,-.6,0,7);c.fill()}
else if(k==='star'){c.rotate(rnd(.6));c.lineJoin='round';c.lineWidth=s*.12;c.beginPath();for(let i=0;i<10;i++){const q=i%2?r*.4:r*.85,a=i*Math.PI/5-Math.PI/2;c.lineTo(Math.cos(a)*q,Math.sin(a)*q)}c.closePath();c.fill();c.stroke();c.fillStyle='rgba(255,255,255,.65)';c.beginPath();c.arc(-r*.2,-r*.2,r*.1,0,7);c.fill()}
else if(k==='flower'){c.rotate(Math.random()*6);for(let i=0;i<5;i++){const a=i*Math.PI*2/5;c.beginPath();c.arc(Math.cos(a)*r*.5,Math.sin(a)*r*.5,r*.38,0,7);c.fill()}c.fillStyle='#fff6a8';c.beginPath();c.arc(0,0,r*.28,0,7);c.fill()}
else if(k==='bubble'){for(let i=0,n=1+(Math.random()*3|0);i<n;i++){const q=s*(.07+Math.random()*.3),ox=rnd(s*.9),oy=rnd(s*.9);c.globalAlpha=.22;c.beginPath();c.arc(ox,oy,q,0,7);c.fill();c.globalAlpha=.9;c.lineWidth=Math.max(1.5,q*.12);c.stroke();c.fillStyle='#fff';c.globalAlpha=.85;c.beginPath();c.arc(ox-q*.35,oy-q*.35,q*.2,0,7);c.fill();c.fillStyle=color}}
else if(k==='paw'){c.rotate(rnd(.8));c.beginPath();c.ellipse(0,r*.25,r*.45,r*.35,0,0,7);c.fill();for(const [px,py] of [[-.6,-.1],[-.22,-.5],[.22,-.5],[.6,-.1]]){c.beginPath();c.arc(px*r,py*r,r*.2,0,7);c.fill()}}
c.restore()}

/* ---------- final sheet (3 x 2) ---------- */
const dstr=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return '’'+String(d.getFullYear()).slice(2)+' '+p(d.getMonth()+1)+' '+p(d.getDate())};
function build(){const cw=480,ch=320,g=22,o=$('#strip');o.width=3*cw+4*g;o.height=2*ch+3*g+46;const c=o.getContext('2d');
c.fillStyle='#bfe6ff';c.fillRect(0,0,o.width,o.height);c.fillStyle='#ffd9ea';for(let y=4,r=0;y<o.height;y+=16,r++)for(let x=(r%2)*8+4;x<o.width;x+=16){c.beginPath();c.arc(x,y,2.4,0,7);c.fill()}
for(let i=0;i<N;i++){const x=g+(i%3)*(cw+g),y=g+((i/3)|0)*(ch+g);c.save();c.beginPath();c.roundRect(x,y,cw,ch,16);
if(photos[i]){c.clip();c.translate(x,y);comp(i,c,cw,ch);c.restore();c.strokeStyle='#fff';c.lineWidth=5;c.beginPath();c.roundRect(x,y,cw,ch,16);c.stroke()}else{c.fillStyle='rgba(255,255,255,.45)';c.fill();c.restore()}}
c.textAlign='center';c.font='26px "Jua",sans-serif';c.lineWidth=6;c.lineJoin='round';c.strokeStyle='#fff';c.fillStyle='#ff6fb5';const t='✦ sticker photo ✦  '+dstr();c.strokeText(t,o.width/2,o.height-14);c.fillText(t,o.width/2,o.height-14)}
$('#done').onclick=()=>{build();go(3)};
$('#back').onclick=()=>{go(2);render();syncFrame();sl2()};
$('#again').onclick=()=>{$('#reset').click();go(1)};
$('#print').onclick=()=>window.print();
$('#save').onclick=()=>{const u=$('#strip').toDataURL('image/png');$('#out').src=u;$('#modal').hidden=false;try{const a=el('a');a.href=u;a.download='sticker-photo.png';a.click()}catch(e){}};
$('#x').onclick=()=>$('#modal').hidden=true;
</script>
</body>
</html>
